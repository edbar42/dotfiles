[mgr]
sort_by = "natural"
ratio = [1, 4, 4]
scrolloff = 10

[preview]
wrap = "yes"
tab_size = 3

[opener]
edit = [
  { run = "nvim %s", block = true },
]
play = [
  { run = "mpv %s", orphan = true },
]
open = [
  { run = "xdg-open %s", desc = "Open" },
]
read = [{ run = "zathura %s", desc = "Read", orphan = true }]

[open]
prepend_rules = [
  { url = "*.pdf", use = "read" },
  { url = "*.epub", use = "read" },
  { url = "*.tex", use = "edit" },
  { url = "*.opus", use = "play" },
  { url = "*.mp3", use = "play" },
]
